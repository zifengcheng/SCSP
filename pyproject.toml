[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "scout-long-context-embeddings"
version = "0.1.0"
description = "Semantic compression-guided selective pooling for long-context embeddings"
readme = "README.md"
requires-python = ">=3.10"
license = {file = "LICENSE"}
dependencies = [
  "datasets>=2.19,<4",
  "numpy>=1.26,<3",
  "pyyaml>=6.0",
  "spacy>=3.7,<4",
  "torch>=2.2",
  "transformers>=4.45,<5",
]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.9"]

[project.scripts]
scout-eval = "scout_embedding.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 92
target-version = "py310"
